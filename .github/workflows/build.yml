# Test, app universale (Apple Silicon + Intel) e DMG.
# - a ogni push e pull request: test e build (DMG negli artifact)
# - a ogni tag vX.Y.Z: in più crea la Release su GitHub con il DMG
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: rclone-mimus (con test)
        run: bash scripts/build-rclone.sh
      - name: App e DMG (con test dell'app)
        run: bash scripts/build-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MIMUS-dmg
          path: dist/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: .github/release-notes.md
