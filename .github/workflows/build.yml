# Test, app universale (Apple Silicon + Intel) e DMG.
# - a ogni push e pull request: test e build (DMG negli artifact)
# - push su main con una VERSION non ancora pubblicata (o tag vX.Y.Z):
#   in più crea la Release su GitHub con DMG, .sha256 e note dal CHANGELOG
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    # Samba vero e mount FUSE (stessa VFS del Mac): server spento, colleghi
    # che modificano, crash, rinomine. Nessun rilascio se si perdono dati.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Samba e FUSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba fuse3 desktop-file-utils >/dev/null
          sudo systemctl stop smbd nmbd samba-ad-dc 2>/dev/null || true
      - name: rclone-mimus per Linux (con test)
        run: TEST_LINUX=1 LINUX=1 NO_DARWIN=1 bash scripts/ci-run.sh rclone-mimus bash scripts/build-rclone.sh
      - name: Prova completa con Samba
        run: sudo -E bash scripts/ci-run.sh e2e bash tests/e2e-linux.sh build/rclone-mimus-linux
      - name: Nessuna perdita di dati
        run: sudo -E bash scripts/ci-run.sh dataloss bash tests/dataloss-linux.sh build/rclone-mimus-linux
      - name: Test dell'app (Go) e dell'estensione del file manager
        run: |
          (cd src/app && bash ../../scripts/ci-run.sh app-go go test ./...)
          bash scripts/ci-run.sh nautilus python3 tests/nautilus-ext.py
      - name: Pacchetti .deb, AppImage e tar
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage \
            || curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool bash scripts/ci-run.sh pacchetti bash scripts/build-linux.sh
      - name: L'app completa per Linux (systemd dell'utente, FUSE, Samba, vassoio, disinstallazione)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          for i in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          systemctl --user is-system-running || true
          mkdir -p /tmp/pkg && tar -C /tmp/pkg -xzf build/linux/mimus-*-linux-amd64.tar.gz
          bash scripts/ci-run.sh app-linux bash tests/app-linux.sh /tmp/pkg/mimus
      - name: Installazione del .deb su Debian e Ubuntu
        run: |
          for img in debian:trixie debian:bookworm ubuntu:24.04; do
            echo "== $img"
            docker run --rm -v "$PWD/build/linux:/pkgs:ro" "$img" bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq /pkgs/mimus_*_amd64.deb >/dev/null
              mimus --version
              /usr/lib/mimus/rclone-mimus version | head -1
              test -f /usr/share/applications/mimus.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/mimus.png
              dpkg -s mimus | grep -q "^Status: install ok installed"
              apt-get remove -y -qq mimus >/dev/null
              test ! -e /usr/bin/mimus
              echo ok'
          done
      - name: AppImage
        run: |
          A=$(ls build/linux/MIMUS-*-x86_64.AppImage)
          chmod +x "$A"
          test "$("$A" --version)" = "$(cat VERSION)"
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 "$A" --version)" = "$(cat VERSION)"
          file build/linux/MIMUS-*-aarch64.AppImage | grep -q -i "aarch64\|ARM"
      - uses: actions/upload-artifact@v4
        with:
          name: MIMUS-linux
          path: build/linux/*
  nix:
    # pacchetto Nix compilato dai sorgenti e modulo NixOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: flake.lock
        run: |
          [ -f flake.lock ] || nix flake lock
          cat flake.lock
      - name: Pacchetto
        run: bash scripts/ci-run.sh nix nix build .#mimus -L
      - name: Prova del pacchetto
        run: |
          test "$(./result/bin/mimus --version)" = "$(cat VERSION)"
          ./result/libexec/mimus/rclone-mimus version | head -1 | grep -q "mimus-$(cat VERSION)"
          ./result/libexec/mimus/rclone-mimus help backends | grep -q offline
          test -f ./result/share/applications/mimus.desktop
          grep -q "per Linux" ./result/libexec/mimus/Guida.html
      - name: Modulo NixOS
        run: |
          nix eval --json .#nixosConfigurations.prova.config.environment.systemPackages --apply 'map (p: p.name)' | tee /tmp/pk.json
          grep -q '"mimus-' /tmp/pk.json && grep -q zenity /tmp/pk.json && grep -q nautilus-python /tmp/pk.json
      - uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
  linux-release:
    # i pacchetti Linux nella Release creata dal job del Mac (non la ritardano)
    needs: [linux, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MIMUS-linux
          path: linux
      - name: Carica nella Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          if ! gh release view "v$V" >/dev/null 2>&1; then echo "nessuna Release v$V"; exit 0; fi
          # solo la prima volta: i file di una versione pubblicata non cambiano
          if gh release view "v$V" --json assets -q '.assets[].name' | grep -q '\.deb$'; then echo "pacchetti Linux già nella Release v$V"; exit 0; fi
          ls linux
          gh release upload "v$V" linux/*.deb linux/*.deb.sha256 linux/*.AppImage linux/*.AppImage.sha256 \
            linux/*.tar.gz linux/*.tar.gz.sha256 --clobber
  build:
    # le prove su Linux girano in parallelo e non bloccano l'app per Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: rclone-mimus (con test)
        run: bash scripts/ci-run.sh rclone-mimus bash scripts/build-rclone.sh
      - name: App e DMG (con test dell'app)
        env:
          REQUIRE_MENU: '1'
        run: bash scripts/ci-run.sh app bash scripts/build-mac-app.sh
      - name: Novità dal server visibili nel Finder in pochi secondi
        run: LIMIT=60 KQLIMIT=45 bash tests/refresh-macos.sh
      - name: Nessuna perdita di dati sul Mac
        run: bash tests/dataloss-macos.sh
      - name: Estensione del Finder
        run: bash tests/finder-macos.sh
      - name: Prova dell'icona nella barra dei menu
        run: bash tests/menubar-macos.sh
      - name: Prova dell'aggiornamento automatico
        run: bash tests/update-macos.sh
      - name: Samba per la prova dell'app completa
        run: brew install samba >/dev/null
      - name: L'app completa (Samba, launchd, riavvio, crash, offline, disinstallazione)
        run: bash scripts/ci-run.sh app-macos bash tests/app-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MIMUS-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Versione da pubblicare?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v$V" ] || { echo "il tag ${GITHUB_REF_NAME} non corrisponde a VERSION ($V)"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ] && ! gh release view "v$V" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "VERSION $V non ancora pubblicata: la pubblico"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Note di rilascio (dal CHANGELOG)
        if: steps.rel.outputs.publish == 'true'
        run: |
          V="${{ steps.rel.outputs.version }}"
          awk -v v="$V" '/^## /{ if (p) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { p = 1; next } } p' CHANGELOG.md > notes.md
          { echo; cat .github/release-notes.md; } >> notes.md
          cat notes.md
      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MIMUS ${{ steps.rel.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.sha256
          body_path: notes.md
