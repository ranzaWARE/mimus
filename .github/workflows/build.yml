# Test, app universale (Apple Silicon + Intel) e DMG.
# - a ogni push e pull request: test e build (DMG negli artifact)
# - push su main con una VERSION non ancora pubblicata (o tag vX.Y.Z):
#   in più crea la Release su GitHub con DMG, .sha256 e note dal CHANGELOG
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: rclone-mimus (con test)
        run: bash scripts/build-rclone.sh
      - name: App e DMG (con test dell'app)
        run: bash scripts/build-mac-app.sh
      - name: Prova dell'aggiornamento automatico
        run: bash tests/update-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MIMUS-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Versione da pubblicare?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v$V" ] || { echo "il tag ${GITHUB_REF_NAME} non corrisponde a VERSION ($V)"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ] && ! gh release view "v$V" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "VERSION $V non ancora pubblicata: la pubblico"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Note di rilascio (dal CHANGELOG)
        if: steps.rel.outputs.publish == 'true'
        run: |
          V="${{ steps.rel.outputs.version }}"
          awk -v v="$V" '/^## /{ if (p) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { p = 1; next } } p' CHANGELOG.md > notes.md
          { echo; cat .github/release-notes.md; } >> notes.md
          cat notes.md
      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MIMUS ${{ steps.rel.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.sha256
          body_path: notes.md
